  <script id="zoom-productos-v118">
    (() => {
      const mediaPC = window.matchMedia("(min-width: 651px)");
      const overlay = document.getElementById("zoomImagenOverlay");
      const imagenAmpliada = document.getElementById("zoomImagenAmpliada");
      const botonCerrar = document.getElementById("cerrarZoomImagen");

      if (!overlay || !imagenAmpliada || !botonCerrar) return;

      let botonAnterior = null;

      function ajustarZoomPantalla() {
        if (!overlay.classList.contains("abierto")) return;

        const anchoNatural = imagenAmpliada.naturalWidth;
        const altoNatural = imagenAmpliada.naturalHeight;
        if (!anchoNatural || !altoNatural) return;

        const margenHorizontal = mediaPC.matches ? 64 : 16;
        const anchoDisponible = Math.max(160, window.innerWidth - margenHorizontal);
        const altoDisponible = Math.max(160, window.innerHeight - 16);
        const escala = Math.min(
          anchoDisponible / anchoNatural,
          altoDisponible / altoNatural
        );

        imagenAmpliada.style.setProperty(
          "width",
          `${Math.floor(anchoNatural * escala)}px`,
          "important"
        );
        imagenAmpliada.style.setProperty(
          "height",
          `${Math.floor(altoNatural * escala)}px`,
          "important"
        );
      }

      function abrirZoom(imagenOrigen) {
        if (imagenOrigen.classList.contains("foto-placeholder")) return;

        const src = imagenOrigen.currentSrc || imagenOrigen.src;
        if (!src) return;

        botonAnterior = document.activeElement;
        imagenAmpliada.src = src;
        imagenAmpliada.alt = imagenOrigen.alt || "Imagen del producto";
        overlay.classList.add("abierto");
        overlay.setAttribute("aria-hidden", "false");
        document.body.classList.add("zoom-imagen-abierto");

        if (imagenAmpliada.complete) {
          requestAnimationFrame(ajustarZoomPantalla);
        }
      }

      function cerrarZoom() {
        overlay.classList.remove("abierto");
        overlay.setAttribute("aria-hidden", "true");
        document.body.classList.remove("zoom-imagen-abierto");
        imagenAmpliada.style.removeProperty("width");
        imagenAmpliada.style.removeProperty("height");
        imagenAmpliada.src = "";

        if (mediaPC.matches && botonAnterior instanceof HTMLElement) {
          botonAnterior.focus({ preventScroll: true });
        }
        botonAnterior = null;
      }

      document.addEventListener("click", (event) => {
        const foto = event.target.closest?.(
          ".contenedor-foto-producto .foto-producto:not(.foto-placeholder)"
        );

        if (foto && !overlay.contains(foto)) {
          event.preventDefault();
          event.stopPropagation();
          abrirZoom(foto);
        }
      }, true);

      imagenAmpliada.addEventListener("click", (event) => {
        event.stopPropagation();
        cerrarZoom();
      });

      imagenAmpliada.addEventListener("load", ajustarZoomPantalla);

      botonCerrar.addEventListener("click", (event) => {
        event.stopPropagation();
        cerrarZoom();
      });

      overlay.addEventListener("click", (event) => {
        /* En móvil y PC, tocar/clickear fuera de la imagen cierra el zoom. */
        if (event.target === imagenAmpliada || botonCerrar.contains(event.target)) return;
        cerrarZoom();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && overlay.classList.contains("abierto")) {
          cerrarZoom();
        }
      });

      window.addEventListener("resize", () => {
        if (overlay.classList.contains("abierto")) {
          ajustarZoomPantalla();
        }
      });

      mediaPC.addEventListener?.("change", () => {
        if (overlay.classList.contains("abierto")) cerrarZoom();
      });
    })();
  </script>

  <script id="ajustes-interaccion-v86">
    (() => {
      /* Limpieza definitiva del estado de −/+ al soltar o cancelar. */
      function limpiarCantidad(boton) {
        if (!boton) return;
        if (window.matchMedia("(max-width:650px)").matches) return;
        boton.classList.remove("seleccionado");
        const control = boton.closest(".control-cantidad");
        if (control) {
          control.classList.remove("seleccionado");
          control.querySelectorAll(".boton-cantidad.seleccionado").forEach((elemento) => {
            elemento.classList.remove("seleccionado");
          });
        }
        if (typeof boton.blur === "function") boton.blur();
      }

      document.addEventListener("pointerup", (event) => {
        limpiarCantidad(event.target.closest?.(".boton-cantidad"));
      }, true);

      document.addEventListener("pointercancel", (event) => {
        limpiarCantidad(event.target.closest?.(".boton-cantidad"));
      }, true);

      document.addEventListener("touchend", (event) => {
        limpiarCantidad(event.target.closest?.(".boton-cantidad"));
      }, { capture:true, passive:true });

      /* En móvil, al abrir Comparar se encuadra la vista instantáneamente. */
      document.addEventListener("click", (event) => {
        const abrir = event.target.closest?.("#abrirComparacion");
        if (!abrir || !window.matchMedia("(max-width:650px)").matches) return;

        window.setTimeout(() => {
          const seccion = document.getElementById("seccionComparacion");
          if (!seccion || seccion.hidden) return;

          seccion.style.zoom = "";

          const acciones = document.querySelector(".acciones-flotantes");
          const marcaInferior = document.querySelector(".marca-inferior-movil");
          const reservadoAbajo =
            (acciones?.getBoundingClientRect().height || 58) +
            (marcaInferior?.getBoundingClientRect().height || 28) +
            8;

          const disponible = Math.max(320, window.innerHeight - reservadoAbajo - 12);
          const alto = seccion.scrollHeight;

          if (alto > disponible) {
            const escala = Math.max(.82, Math.min(1, disponible / alto));
            seccion.style.zoom = String(escala);
          }

          const marca = seccion.querySelector(".marca-comparacion-movil");
          const titulo = seccion.querySelector(".encabezado-comparacion");
          const destino = titulo || seccion;
          const compensacion = (marca?.getBoundingClientRect().height || 0) + 8;
          const top = window.scrollY + destino.getBoundingClientRect().top - compensacion;
          window.scrollTo({ top:Math.max(0, top), behavior:"auto" });
        }, 80);
      }, true);

      /* Al volver al catálogo se elimina cualquier escala temporal. */
      document.addEventListener("click", (event) => {
        if (!event.target.closest?.("#volverCatalogo")) return;
        const seccion = document.getElementById("seccionComparacion");
        if (seccion) seccion.style.zoom = "";
      }, true);
    })();
  </script>

  <script id="bloqueo-menu-fotos-v148">
    (() => {

        return elemento?.closest?.(".foto-producto, .zoom-imagen-ampliada");
      }

      document.addEventListener("contextmenu", (event) => {

        event.preventDefault();

        event.preventDefault();
      }, true);
    })();

  <script id="reubicar-selector-comparacion-movil-v211">
    (() => {
      const consultaMovil = window.matchMedia("(max-width:650px)");
      let enActualizacion = false;

      function reubicarSelector(tarjeta, esMovil){
        const acciones = tarjeta.querySelector('.encabezado-producto .acciones-producto');
        const contenedorFoto = tarjeta.querySelector('.contenedor-foto-producto');
        const selector = tarjeta.querySelector('.selector-comparacion');
        if (!acciones || !contenedorFoto || !selector) return;

        if (esMovil) {
          if (selector.parentElement !== acciones) {
            acciones.appendChild(selector);
          }
        } else {
          if (selector.parentElement !== contenedorFoto) {
            contenedorFoto.insertBefore(selector, contenedorFoto.firstChild);
          }
        }
      }

      function actualizarUbicacion(){
        if (enActualizacion) return;
        enActualizacion = true;
        const esMovil = consultaMovil.matches;
        document
          .querySelectorAll('#productos .tarjeta-producto, #productosComparados .tarjeta-producto')
          .forEach((tarjeta) => reubicarSelector(tarjeta, esMovil));
        enActualizacion = false;
      }

      function programarActualizacion(){
        window.requestAnimationFrame(actualizarUbicacion);
      }

      function iniciar(){
        const productos = document.getElementById('productos');
        const comparados = document.getElementById('productosComparados');
        const observador = new MutationObserver(programarActualizacion);

        if (productos) {
          observador.observe(productos, { childList:true, subtree:true });
        }

        if (comparados) {
          observador.observe(comparados, { childList:true, subtree:true });
        }

        programarActualizacion();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', iniciar, { once:true });
      } else {
        iniciar();
      }

      if (typeof consultaMovil.addEventListener === 'function') {
        consultaMovil.addEventListener('change', programarActualizacion);
      } else if (typeof consultaMovil.addListener === 'function') {
        consultaMovil.addListener(programarActualizacion);
      }

      window.addEventListener('resize', programarActualizacion, { passive:true });
    })();
  </script>
