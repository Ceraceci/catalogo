<script src="script.js?v=5"></script>


<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ceraceci - Catálogo</title>

  <link rel="stylesheet" href="style.css?v=5">
</head>

<body>
  <main class="contenedor">

    <header class="cabecera">
      <div class="logo-contenedor">

        <img
          src="img/logo.png"
          alt="Ceraceci"
          class="logo"
        >

        <p class="subtitulo-principal">
          Insumos para la Industria Cerámica
        </p>

      </div>
    </header>

    <section class="busqueda">
      <input
        type="search"
        id="buscador"
        placeholder="Buscar por nombre, código, categoría o presentación..."
        autocomplete="off"
      >

      <select id="filtroCategoria">
        <option value="">
          Todas las categorías
        </option>
      </select>

      <select id="ordenarProductos" aria-label="Ordenar productos">
        <option value="nombre-asc">Nombre: A–Z</option>
        <option value="nombre-desc">Nombre: Z–A</option>
        <option value="precio-asc">Precio: menor a mayor</option>
        <option value="precio-desc">Precio: mayor a menor</option>
      </select>
    </section>

    <p id="estado">Cargando productos...</p>

    <section id="productos" class="productos"></section>

  </main>

  <div class="acciones-flotantes">

    <a href="https://www.instagram.com/ceraceci/"
       target="_blank"
       rel="noopener noreferrer"
       class="instagram-flotante"
       aria-label="Visitar Instagram"
       title="Seguinos en Instagram">
      <!-- SVG sin cambios -->
    </a>

    <a href="https://wa.me/5492477314865?text=Hola%20Ceraceci%2C%20estoy%20viendo%20el%20cat%C3%A1logo%20y%20quisiera%20hacer%20una%20consulta."
       target="_blank"
       rel="noopener noreferrer"
       class="whatsapp-flotante"
       aria-label="Consultar por WhatsApp"
       title="Consultanos por WhatsApp">
      <!-- SVG sin cambios -->
    </a>

    <button
      type="button"
      id="abrirCarrito"
      class="abrir-carrito"
      aria-label="Abrir carrito"
      title="Abrir carrito">
      <span class="icono-carrito">🛒</span>
      <strong id="cantidadCarrito">0 | $0</strong>
    </button>

  </div>

  <div id="fondoCarrito" class="fondo-carrito"></div>
  <aside id="carrito" class="carrito"></aside>

  <div id="avisoCopiado" class="aviso-copiado">
    Enlace copiado
  </div>

  <script src="script.js?v=5"></script>
</body>
</html>
