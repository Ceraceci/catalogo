  <script id="zoom-productos-v67">
    (() => {
      const mediaPC = window.matchMedia("(min-width: 651px)");
      const overlay = document.getElementById("zoomImagenOverlay");
      const imagenAmpliada = document.getElementById("zoomImagenAmpliada");
      const botonCerrar = document.getElementById("cerrarZoomImagen");

      if (!overlay || !imagenAmpliada || !botonCerrar) return;

      let botonAnterior = null;

      function abrirZoom(imagenOrigen) {
        if (imagenOrigen.classList.contains("foto-placeholder")) return;

        const src = imagenOrigen.currentSrc || imagenOrigen.src;
        if (!src) return;

        botonAnterior = document.activeElement;
        overlay.classList.remove("nivel-2");
        imagenAmpliada.style.width = "";
        imagenAmpliada.style.height = "";
        imagenAmpliada.src = src;
        imagenAmpliada.alt = imagenOrigen.alt || "Imagen del producto";
        overlay.classList.add("abierto");
        overlay.setAttribute("aria-hidden", "false");
        document.body.classList.add("zoom-imagen-abierto");

        if (mediaPC.matches) {
          requestAnimationFrame(() => {
            botonCerrar.focus({ preventScroll: true });
          });
        }
      }

      function cerrarZoom() {
        overlay.classList.remove("abierto", "nivel-2");
        overlay.setAttribute("aria-hidden", "true");
        document.body.classList.remove("zoom-imagen-abierto");
        imagenAmpliada.style.width = "";
        imagenAmpliada.style.height = "";
        imagenAmpliada.src = "";

        if (mediaPC.matches && botonAnterior instanceof HTMLElement) {
          botonAnterior.focus({ preventScroll: true });
        }
        botonAnterior = null;
      }

      function ajustarSegundoZoom() {
        if (!mediaPC.matches || !overlay.classList.contains("nivel-2")) return;

        const anchoNatural = imagenAmpliada.naturalWidth;
        const altoNatural = imagenAmpliada.naturalHeight;
        if (!anchoNatural || !altoNatural) return;

        const anchoDisponible = Math.max(220, window.innerWidth - 120);
        const altoDisponible = Math.max(180, window.innerHeight - 56);
        const escala = Math.min(
          anchoDisponible / anchoNatural,
          altoDisponible / altoNatural
        );

        imagenAmpliada.style.width = `${Math.floor(anchoNatural * escala)}px`;
        imagenAmpliada.style.height = `${Math.floor(altoNatural * escala)}px`;
      }

      function alternarSegundoZoom() {
        if (!mediaPC.matches || !overlay.classList.contains("abierto")) return;

        if (!overlay.classList.contains("nivel-2")) {
          overlay.classList.add("nivel-2");
          ajustarSegundoZoom();
        } else {
          overlay.classList.remove("nivel-2");
          imagenAmpliada.style.width = "";
          imagenAmpliada.style.height = "";
        }
      }

      document.addEventListener("click", (event) => {
        const foto = event.target.closest?.(
          ".contenedor-foto-producto .foto-producto:not(.foto-placeholder)"
        );

        if (foto && !overlay.contains(foto)) {
          event.preventDefault();
          event.stopPropagation();
          abrirZoom(foto);
        }
      }, true);

      imagenAmpliada.addEventListener("click", (event) => {
        event.stopPropagation();
        if (mediaPC.matches) alternarSegundoZoom();
      });

      botonCerrar.addEventListener("click", (event) => {
        event.stopPropagation();
        cerrarZoom();
      });

      overlay.addEventListener("click", (event) => {
        /* En móvil y PC, tocar/clickear fuera de la imagen cierra el zoom. */
        if (event.target === imagenAmpliada || botonCerrar.contains(event.target)) return;
        cerrarZoom();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && overlay.classList.contains("abierto")) {
          cerrarZoom();
        }
      });

      window.addEventListener("resize", () => {
        if (mediaPC.matches && overlay.classList.contains("nivel-2")) {
          ajustarSegundoZoom();
        }
      });

      mediaPC.addEventListener?.("change", () => {
        if (overlay.classList.contains("abierto")) cerrarZoom();
      });
    })();
  </script>



  <script id="marca-sticky-v65">
    (() => {
      const cabecera = document.querySelector(".cabecera");
      if (!cabecera) return;

      const actualizarMarca = () => {
        const limite = cabecera.getBoundingClientRect().bottom;
        document.body.classList.toggle("marca-scroll-activa", limite <= 8);
      };

      actualizarMarca();
      window.addEventListener("scroll", actualizarMarca, { passive: true });
      window.addEventListener("resize", actualizarMarca, { passive: true });
    })();
  </script>

        Date.now().toString()
      );

    scriptCeraceci.async = false;

    document.body.appendChild(
      scriptCeraceci
    );
